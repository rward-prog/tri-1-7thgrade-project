<script>
/* ---- rosters/grade8.js ---- */
'use strict';
/* ROSTER FILE: the only place student names live.
   FIRST NAMES ONLY, grade 8. No last names, emails, phone numbers, or addresses belong here. */
const ROSTER = {
  grade: 8,
  names: ["Oliver","David","Cyrus","Kamran","Zaki","Julien","Alex","Drew","Dean","Alec","Masen","Cam","Reid",
    "Benjamin","Max","William","John","Jamie","Immanuel","Andy","Sam","Saahil","Jeeva","Rafay","Ari","Luke",
    "Peter","Timothy","Stan","Dilan","Dylan","Quentin","Wayne","James","Will","Ammar","Viaan","Eric","Matthew",
    "Bode","Aditya","Alden","Chad","Sidney","Joshua","Henry","Preston","Lawrence"]
};

/* ---- engine/01-core.js ---- */
'use strict';
/* ---------- random helpers (seedable so tests can replay) ---------- */
let _rng = Math.random;
function setRng(f) { _rng = f; }
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = () => _rng();
const ri = (lo, hi) => lo + Math.floor(rand() * (hi - lo + 1));
const pick = a => a[Math.floor(rand() * a.length)];
function shuffle(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
  return b;
}

/* ---------- number formatting ---------- */
function sig(x, n) { return Number(Number(x).toPrecision(n)); }
function fmt(x, n) {                       // n significant figures, trailing zeros trimmed
  let s = Number(x).toPrecision(n);
  if (s.indexOf('e') >= 0) s = String(Number(s));
  if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return s;
}
function sci(x, n) {                       // 1.8 x 10^-7 as HTML
  n = n || 2;
  let e = Math.floor(Math.log10(Math.abs(x)));
  let m = Number((x / Math.pow(10, e)).toPrecision(n));
  if (m >= 10) { m = Number((m / 10).toPrecision(n)); e += 1; }
  return m.toFixed(n - 1) + ' &times; 10<sup>' + String(e).replace('-', '&minus;') + '</sup>';
}
const G_EARTH = 9.8, G_EARTH_ALT = 9.81;   // site shows 9.8; both are accepted
/* true when a quantity computed with g=9.8 and g=9.81 shows the same value at n sig figs */
function sameBoth(fn, n) { return fmt(fn(G_EARTH), n) === fmt(fn(G_EARTH_ALT), n); }

/* ---------- names (first names only; staff/Murphy play anyone who makes a mistake) ---------- */
function oneName() { return pick(ROSTER.names); }
function twoNames() {
  const a = oneName(); let b;
  do { b = oneName(); } while (b[0] === a[0]);      // never near-identical names in one scenario
  return [a, b];
}

/* ---------- free-body diagram SVG ---------- */
const FCLS = { Fapp: 'app', FT: 't', FN: 'n', FFr: 'fr', Fspring: 'sp', Fg: 'g' };
function _label(t) {
  const m = /^F(app|T|N|Fr|spring|g)$/.exec(t);
  if (!m) return t;                                   // custom label, e.g. "force of motion"
  return 'F<tspan class="sub" dy="3">' + m[1] + '</tspan>';
}
function fbd(forces, o) {
  o = o || {};
  const W = 440, H = 180, cx = 220, cy = 90, u = 20, r = 7;
  const lanes = { up: 0, down: 0, left: 0, right: 0 }, LANE = [0, 22, -22];   // same-direction arrows sit side by side
  let body = '', desc = [];
  forces.forEach(f => {
    const maxLen = (f.dir === 'up' || f.dir === 'down') ? 3 : 4;
    const len = Math.min(f.len, maxLen);
    const cls = FCLS[f.t] || 'x';
    const off = LANE[Math.min(lanes[f.dir]++, 2)];
    const L = r + 2 + len * u;                       // tip distance from center
    const s = r + 2;
    let x1 = cx, y1 = cy, x2 = cx, y2 = cy, lx, ly, anchor = 'middle';
    if (f.dir === 'up')    { x1 = x2 = cx + off; y1 = cy - s; y2 = cy - L; lx = x2 + 10; ly = y2 + 6; anchor = 'start'; }
    if (f.dir === 'down')  { x1 = x2 = cx + off; y1 = cy + s; y2 = cy + L; lx = x2 + 10; ly = y2 - 2; anchor = 'start'; }
    if (f.dir === 'left')  { y1 = y2 = cy + off; x1 = cx - s; x2 = cx - L; lx = x2 - 6; ly = y2 - 8; anchor = 'end'; }
    if (f.dir === 'right') { y1 = y2 = cy + off; x1 = cx + s; x2 = cx + L; lx = x2 + 6; ly = y2 - 8; anchor = 'start'; }
    const hs = 6;                                    // arrowhead half-size
    let head;
    if (f.dir === 'up')    head = [x2, y2, x2 - hs, y2 + 10, x2 + hs, y2 + 10];
    if (f.dir === 'down')  head = [x2, y2, x2 - hs, y2 - 10, x2 + hs, y2 - 10];
    if (f.dir === 'left')  head = [x2, y2, x2 + 10, y2 - hs, x2 + 10, y2 + hs];
    if (f.dir === 'right') head = [x2, y2, x2 - 10, y2 - hs, x2 - 10, y2 + hs];
    const shaftEnd = { up: [x2, y2 + 9], down: [x2, y2 - 9], left: [x2 + 9, y2], right: [x2 - 9, y2] }[f.dir];
    const lead = off ? '<line class="lead" x1="' + cx + '" y1="' + cy + '" x2="' + x1 + '" y2="' + y1 + '" />' : '';
    body += '<g class="fa f-' + cls + '">' + lead +
      '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + shaftEnd[0] + '" y2="' + shaftEnd[1] + '" />' +
      '<polygon points="' + head.join(' ') + '" />' +
      '<text x="' + lx + '" y="' + ly + '" text-anchor="' + anchor + '">' + _label(f.t) +
      (f.src ? '<tspan class="src" dx="4"> (' + f.src + ')</tspan>' : '') + '</text></g>';
    desc.push(f.t + ' ' + f.dir + (f.src ? ' (' + f.src + ')' : '') + ', length ' + len);
  });
  const label = 'Free-body diagram: ' + (desc.length ? desc.join('; ') : 'no arrows');
  return '<svg class="fbd" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + label + '">' +
    '<title>' + label + '</title><circle class="dot" cx="' + cx + '" cy="' + cy + '" r="' + r + '" />' + body + '</svg>';
}

/* ---- engine/05-murphy.js ---- */
'use strict';
/* Murphy the dog: the ONLY image in the project. A photo of the teacher's own dog, supplied by the teacher.

'use strict';
/* ======================= QUESTION REGISTRY =======================
   Fixed items (F) are one question each. Templates (T) are skills that make fresh numbers/names each time.
   Every item or skill has a permanent ID. Never rename, renumber, or reuse an ID. */
const QDEFS = { byKey: {}, order: [] };
function _add(key, def) {
  if (QDEFS.byKey[key]) throw new Error('Duplicate ID: ' + key);
  QDEFS.byKey[key] = def; QDEFS.order.push(key);
}
/* F(id, topic, prior, prompt, rightHTML, [[wrongHTML, why],...], explain, {hint, retired})
   retired: true keeps the ID reserved (IDs are permanent) but the question is never shown to students. */
function F(id, topic, prior, prompt, right, wrongs, explain, opt) {
  opt = opt || {};
  _add(id, { kind: 'fixed', key: id, topic: topic, chal: topic === 'chal', prior: prior, prompt: prompt,
    right: right, wrongs: wrongs, explain: explain, hint: opt.hint || null, retired: !!opt.retired,
    label: String(prompt).replace(/<[^>]+>/g, '').slice(0, 90) });
}
/* T(id, topic, prior, name, gen) where gen() returns {prompt, right, wrongs, explain, hint?, meta?} */
function T(id, topic, prior, name, gen) {
  _add(id, { kind: 'template', key: id, topic: topic, chal: topic === 'chal', prior: prior, label: name, gen: gen });
}
function makeQuestion(key) {
  const d = QDEFS.byKey[key];
  if (!d) throw new Error('Unknown question key: ' + key);
  const g = d.kind === 'fixed' ? d : d.gen();
  // g.ordered = a fixed A-D order (used when an answer says "Choices A and B"); otherwise choices are shuffled
  const choices = g.ordered ? g.ordered : [{ html: g.right, ok: true, why: '' }].concat(g.wrongs.map(w => ({ html: w[0], ok: false, why: w[1] })));
  return { key: key, kind: d.kind, topic: d.topic, chal: d.chal, prior: d.prior, label: d.label,
    prompt: g.prompt, choices: g.ordered ? choices : shuffle(choices), explain: g.explain, hint: g.hint || d.hint || null, meta: g.meta || null };
}

function encodeProgress(st) {
  const bits = [];
  _pushBits(bits, 1, 6); _pushBits(bits, _hash10(UNIT.id), 10);
  _pushBits(bits, REGISTRY.length, 8);
  REGISTRY.forEach(k => { const c = st.keys[k] || [0, 0]; const s = _scale(c[0], c[1]); _pushBits(bits, s[0], 3); _pushBits(bits, s[1], 3); });
  const tp = UNIT.topics.map(t => t.id);
  _pushBits(bits, tp.length, 6);
  ['pre', 'post'].forEach(w => tp.forEach(t => { const c = st[w][t] || [0, 0]; const s = _scale15(c[0], c[1]); _pushBits(bits, s[0], 4); _pushBits(bits, s[1], 4); }));

}
/* returns {ok:true, state} or {ok:false, error:'friendly message'} */
function decodeProgress(text) {
  let s = String(text || '').toUpperCase().replace(/[\s-]/g, '');
  const pre = UNIT.codePrefix.toUpperCase();
  if (!s) return { ok: false, error: 'Paste your code first.' };
  if (s.indexOf(pre) !== 0) return { ok: false, error: 'That does not look like a code from this unit. Codes start with ' + UNIT.codePrefix + '. If it came from a different unit, use this unit\u2019s code instead.' };
  s = s.slice(pre.length).replace(/I/g, '1').replace(/L/g, '1').replace(/O/g, '0').replace(/U/g, 'V');
  const bits = [];
  for (const ch of s) { const v = B32.indexOf(ch); if (v < 0) return { ok: false, error: 'That code has a character that is not allowed. Check for typos.' }; for (let i = 4; i >= 0; i--) bits.push((v >> i) & 1); }
  if (bits.length < 40) return { ok: false, error: 'That code is too short. Make sure you copied the whole thing.' };
  const pos = { p: 0 };
  const ver = _readBits(bits, pos, 6);
  if (ver !== 1) return { ok: false, error: 'This code was made by a newer version of the site. Refresh the page and try again.' };
  const unit = _readBits(bits, pos, 10);
  const n = _readBits(bits, pos, 8);
  const need = 6 + 10 + 8 + n * 6 + 6;
  if (bits.length < need + 16) return { ok: false, error: 'That code is too short. Make sure you copied the whole thing.' };
  const keysData = []; for (let i = 0; i < n; i++) keysData.push([_readBits(bits, pos, 3), _readBits(bits, pos, 3)]);
  const T = _readBits(bits, pos, 6);
  const total = need + T * 16;
  if (bits.length < total + 16) return { ok: false, error: 'That code is too short. Make sure you copied the whole thing.' };
  const pp = []; for (let i = 0; i < T; i++) pp.push([_readBits(bits, pos, 4), _readBits(bits, pos, 4)]);
  const qq = []; for (let i = 0; i < T; i++) qq.push([_readBits(bits, pos, 4), _readBits(bits, pos, 4)]);
  const crcPos = pos.p; const crc = _readBits(bits, pos, 16);
  if (_crc16(bits.slice(0, crcPos)) !== crc) return { ok: false, error: 'That code does not look right. Check for a mistyped or missing character.' };
  const rest = bits.slice(pos.p);
  if (rest.length >= 5) return { ok: false, error: 'That code is longer than expected. Make sure you copied only the code.' };
  if (rest.some(b => b !== 0)) return { ok: false, error: 'That code does not look right. Check for a mistyped or missing character.' };
  if (unit !== _hash10(UNIT.id)) return { ok: false, error: 'This code is from a different unit.' };
  const st = newState();
  keysData.forEach((c, i) => { if (REGISTRY[i] && (c[0] || c[1])) st.keys[REGISTRY[i]] = [c[0], c[1]]; });
  const tp = UNIT.topics.map(t => t.id);
  tp.forEach((t, i) => { if (i < T) { if (pp[i][1]) st.pre[t] = [pp[i][0], pp[i][1]]; if (qq[i][1]) st.post[t] = [qq[i][0], qq[i][1]]; } });
  return { ok: true, state: st };
}

/* ---------- home ---------- */

/* ---------- question ---------- */
function startCheck(kind) {
  const avoid = kind === 'post' ? (S._preKeys || null) : null;
  SESSION = { mode: kind, scope: S.scope, queue: buildCheck(S.scope, avoid), idx: 0, results: [], recent: [] };
  if (kind === 'pre') { S._preKeys = SESSION.queue.slice(); saveState(); }
  nextQuestion();
}
function startPractice(topics) {
  const base = S.scope || scopeUnit();
  const scope = topics ? Object.assign({}, base, { topics: topics }) : base;
  SESSION = { mode: base.type === 'chal' ? 'chal' : 'practice', scope: scope, results: [], recent: [] };
  nextQuestion();
}
function nextQuestion() {
  const sc = SESSION;
  let key;
  if (sc.mode === 'pre' || sc.mode === 'post') { if (sc.idx >= sc.queue.length) return finishCheck(); key = sc.queue[sc.idx]; }
  else { key = nextPracticeKey(sc.scope, sc.recent); sc.recent.push(key); if (sc.recent.length > 3) sc.recent.shift(); }
  Object.assign(sc, { q: makeQuestion(key), picked: null, conf: null, hints: 0, elim: [], hintTexts: [], showed: false, done: false });
  go('#/q');
}
function qView() {
  if (!SESSION || !SESSION.q) return homeView();

  const d = difficulty(q.key);
  const modeLbl = { pre: 'Pre-check', post: 'Post-check', practice: 'Practice', chal: 'Challenge' }[s.mode];
  const prog = check ? 'Question ' + (s.done ? s.idx : s.idx + 1) + ' of ' + s.queue.length : 'Question ' + (s.results.length + 1) + (s.results.length ? ' \u00b7 ' + s.results.filter(r => r.ok).length + ' of ' + s.results.length + ' right so far' : '');
  const choices = q.choices.map((c, i) => {
    let cls = 'ch';
    if (s.done) cls += c.ok ? ' right' : (i === s.picked ? ' wrong' : ' off');
    else { if (i === s.picked) cls += ' sel'; if (s.elim.indexOf(i) >= 0) cls += ' gone'; }
    return '<li><button class="' + cls + '" data-act="choose" data-i="' + i + '"' + ((s.done || s.elim.indexOf(i) >= 0) ? ' disabled' : '') + ' aria-pressed="' + (i === s.picked) + '">' +
      '<span class="ltr">' + LETTERS[i] + '</span><span class="ctext">' + c.html + '</span></button>' +
      (s.done && !c.ok ? '<div class="why"><b>Why not ' + LETTERS[i] + '?</b> ' + esc(c.why) + '</div>' : '') +
      (s.done && c.ok ? '<div class="why good"><b>Why ' + LETTERS[i] + ' is right:</b> ' + esc(q.explain.replace(/<[^>]+>/g, '')) + '</div>' : '') + '</li>';
  }).join('');
  const hintBox = s.hintTexts.map(t => '<p class="hint">' + t + '</p>').join('') + (s.showed && !s.done ? '<div class="how"><b>Show me how:</b> ' + q.explain + '</div>' : '');
  const conf = !s.done ? '<div class="conf" role="group" aria-label="How sure are you?"><span>How sure are you?</span>' +
    [['sure', 'Sure'], ['mid', 'Pretty sure'], ['guess', 'Guessing']].map(c => '<button class="pill' + (s.conf === c[0] ? ' on' : '') + '" data-act="conf" data-v="' + c[0] + '">' + c[1] + '</button>').join('') + '</div>' : '';
  let fb = '';

    const c = s.q.choices[s.picked], ok = c && c.ok, last = s.results[s.results.length - 1];

      (!ok && s.conf === 'sure' && !(last && last.skipped) ? ' You were sure, so this is a great one to learn from.' : '') +
      (s.showed ? ' (Used Show me how, so this one doesn\u2019t count toward class data.)' : '') +
      '<div class="tough">How tough: ' + d2 + '/100 \u00b7 ' + diffBand(d2) + ' \u00b7 ' + diffLabel(q.key) + '</div></div>';

    ? '<button class="btn" data-act="next">' + (lastQ ? 'See my results' : 'Next question') + '</button>' +
      (!check ? '<button class="btn ghost" data-act="finish-practice">I\u2019m done: check how I did</button>' : '')

      (!check ? '<button class="btn ghost" data-act="hint"' + (s.hints >= 3 ? ' disabled' : '') + '>Hint (' + s.hints + ' of 3 used)</button><button class="btn ghost" data-act="how">Show me how</button>' : '') +

    (s.mode === 'chal' ? '<p class="banner">This goes beyond the test, but it\u2019s good to know!</p>' : '') +
    '<div class="qhead"><span class="mode">' + modeLbl + '</span>' + chip(q.topic) + '<span class="prog">' + prog + '</span></div>' +
    (s.done ? '' : diffLine) +

function answer(skipped) {
  const s = SESSION, q = s.q;
  const c = skipped ? null : q.choices[s.picked], ok = !!(c && c.ok);
  const assisted = s.showed ? 'how' : (s.hints > 0 ? 'hint' : null);
  if (!skipped) {
    recordLocal(q.key, ok, assisted, s.conf);
    if (!assisted) reportClass(q.key, ok);
  }
  s.results.push({ key: q.key, topic: q.topic, ok: ok, skipped: !!skipped });
  s.done = true; if (skipped) s.picked = -1;
  if (s.mode === 'pre' || s.mode === 'post') s.idx += 1;

function finishCheck() {

  Object.keys(per).forEach(t => { if (per[t][1]) S[kind][t] = per[t]; });
  saveState();
  s.finished = { kind: kind, per: per };
  go('#/result');
}

function resultView() {

  const tot = topics.reduce((a, t) => [a[0] + per[t][0], a[1] + per[t][1]], [0, 0]);
  if (f.kind === 'pre') {
    const weak = topics.filter(t => per[t][1] && per[t][0] / per[t][1] < 0.75);
    const pick = weak.length ? weak : topics;
    const rows = topics.map(t => '<label class="chk"><input type="checkbox" data-act="plan-toggle" data-id="' + t + '"' + (pick.indexOf(t) >= 0 ? ' checked' : '') + '><span><b>' + esc(UNIT.topicById[t].name) + '</b>' +
      '<small>' + per[t][0] + ' of ' + per[t][1] + ' right on the pre-check</small></span><span class="tough">' + topicDifficulty(t) + '/100</span></label>').join('');
    return shell('<section class="card"><p class="kicker">Pre-check done</p><h1>' + tot[0] + ' of ' + tot[1] + ' right</h1>' +

      '<div class="checks">' + rows + '</div><div class="btns"><button class="btn" data-act="start-plan">Start practice</button></div></section>');
  }
  const rows = topics.map(t => {

    const dp = pre && pre[1] ? Math.round(100 * pre[0] / pre[1]) : null, dq = post[1] ? Math.round(100 * post[0] / post[1]) : 0;
    const delta = dp === null ? '' : (dq - dp > 0 ? '<span class="up">+' + (dq - dp) + ' points</span>' : dq - dp < 0 ? '<span class="down">' + (dq - dp) + ' points</span>' : '<span>same</span>');

  }).join('');
  return shell('<section class="card"><p class="kicker">Post-check done</p><h1>' + tot[0] + ' of ' + tot[1] + ' right</h1><p>Here is how each topic changed from your pre-check. Everything is saved on this device.</p>' +
    '<div class="growth">' + rows + '</div><div class="btns"><button class="btn" data-act="start-practice">Practice more</button><a class="btn ghost" href="#/code">Save my code</a><a class="btn ghost" href="#/">Home</a></div></section>');
}

      '<h4>A strong sample answer</h4><blockquote>' + w.sample + '</blockquote><h4>What makes it strong</h4><ul>' + w.why.map(a => '<li>' + a + '</li>').join('') + '</ul></details>').join(''));
}

/* ---------- class insights ---------- */
function insightsView() {
  const topicRows = UNIT.topics.map(t => {
    const ks = keysOfTopic(t.id), tries = ks.reduce((a, k) => a + (CLASS[k] ? CLASS[k][0] : 0), 0);
    return '<tr><td>' + esc(t.name) + '</td><td>' + tries + '</td><td>' + (tries >= UNIT.minShow ? topicDifficulty(t.id) + '/100 ' + gauge(topicDifficulty(t.id)) : 'Starting estimate: ' + topicDifficulty(t.id) + '/100') + '</td></tr>';
  }).join('');
  const quizRows = UNIT.quizzes.map(q => {
    const ks = q.topics.reduce((a, t) => a.concat(keysOfTopic(t)), []), tries = ks.reduce((a, k) => a + (CLASS[k] ? CLASS[k][0] : 0), 0);
    const d = Math.round(q.topics.reduce((s, t) => s + topicDifficulty(t), 0) / q.topics.length);
    return '<tr><td>' + esc(q.name) + '</td><td>' + tries + '</td><td>' + d + '/100 ' + gauge(d) + '</td></tr>';
  }).join('');
  const itemRow = k => {
    const c = CLASS[k] || [0, 0], d = QDEFS.byKey[k], diff = difficulty(k), ex = expectation(k);
    const st = c[0] < UNIT.minShow ? '<span class="status s-new">Not enough data yet</span>' : ex === 'harder' ? '<span class="status s-work">Harder than expected</span>' : ex === 'easier' ? '<span class="status s-ready">Easier than expected</span>' : '<span class="status s-almost">About as expected</span>';
    return '<tr><td>' + esc(d.label) + '<small>' + (d.kind === 'template' ? 'Skill (new numbers each time) \u00b7 ' : '') + esc(k) + '</small></td><td>' + esc(UNIT.topicById[d.topic].name) + '</td><td>' + c[0] + '</td><td>' + c[1] + '</td><td>' + (c[0] < UNIT.minShow ? 'Estimate ' + d.prior : diff + '/100') + '</td><td>' + st + '</td></tr>';
  };
  const graded = QDEFS.order.filter(k => !QDEFS.byKey[k].chal && !QDEFS.byKey[k].retired).sort((a, b) => difficulty(b) - difficulty(a));
  const chal = QDEFS.order.filter(k => QDEFS.byKey[k].chal && !QDEFS.byKey[k].retired).sort((a, b) => difficulty(b) - difficulty(a));
  const banner = CLASS_MODE === 'live' ? '<p class="banner ok">Live class data. Every number here is anonymous: no names, no student information.</p>'
    : CLASS_MODE === 'offline' ? '<p class="banner">Could not reach the class data right now, so this page is showing estimates and this device only. Try again later.</p>'
    : '<p class="banner">Test mode: the class counters are not connected yet, so only answers from this device are counted here. When the site is connected, this page will show the whole class.</p>';
  return shell('<h1>Class insights</h1><p class="lead">What is hard in this unit, based on every student\u2019s answers. Nothing here identifies a student.</p>' + banner +
    '<div class="card"><h2>Unit difficulty: ' + unitDifficulty() + '/100 ' + gauge(unitDifficulty()) + '</h2><p class="small">Starts as my estimate and moves toward real class data. With about ' + UNIT.minTrust + ' tries on a question, the number is mostly real data. Challenge is not included.</p></div>' +
    '<div class="card"><h2>By homework quiz</h2><div class="scroll"><table><thead><tr><th>Quiz</th><th>Tries</th><th>How tough</th></tr></thead><tbody>' + quizRows + '</tbody></table></div></div>' +
    '<div class="card"><h2>By topic</h2><div class="scroll"><table><thead><tr><th>Topic</th><th>Tries</th><th>How tough</th></tr></thead><tbody>' + topicRows + '</tbody></table></div></div>' +
    '<div class="card"><h2>Every question and skill, hardest first</h2><div class="scroll"><table><thead><tr><th>Question</th><th>Topic</th><th>Tries</th><th>Misses</th><th>How tough</th><th>Compared with my estimate</th></tr></thead><tbody>' + graded.map(itemRow).join('') + '</tbody></table></div></div>' +
    '<div class="card chalcard"><p class="banner">This goes beyond the test, but it\u2019s good to know!</p><h2>Challenge (tracked separately)</h2><div class="scroll"><table><thead><tr><th>Question</th><th>Topic</th><th>Tries</th><th>Misses</th><th>How tough</th><th>Compared with my estimate</th></tr></thead><tbody>' + chal.map(itemRow).join('') + '</tbody></table></div></div>');
}

/* ---------- save and restore ---------- */
let CODE_MSG = '';
function codeView() {
  return shell('<h1>Save or restore my progress</h1><p class="lead">Your practice history lives on this device. To keep going on another computer, copy your code, open this unit there, and paste it in.</p>' +
    '<div class="card"><h2>My code</h2><textarea id="mycode" readonly rows="4" aria-label="My progress code">' + esc(encodeProgress(S)) + '</textarea>' +
    '<div class="btns"><button class="btn" data-act="copy-code">Copy my code</button></div><p class="small" id="copymsg" role="status"></p></div>' +
    '<div class="card"><h2>Restore from a code</h2><textarea id="incode" rows="4" placeholder="Paste a code that starts with ' + UNIT.codePrefix + '" aria-label="Paste a progress code"></textarea>' +
    '<div class="btns"><button class="btn" data-act="restore-code">Restore</button></div><p class="small" id="restoremsg" role="status">' + esc(CODE_MSG) + '</p></div>' +
    '<div class="card"><h2>Start over</h2><p class="small">Clears the practice history on this device. Class data is not affected.</p><div class="btns"><button class="btn quiet" data-act="reset">Clear my progress</button></div></div>');
}


/* ---------- full practice test ---------- */
let TEST = null;
function testCount() { return UNIT.test.parts.reduce((a, p) => a + p.slots.length, 0); }
function testBlurb() { return testCount() + ' questions in the same style and length as last year\u2019s test. No hints, and your score comes at the end.'; }
function fmtTime(ms) { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function testPlanView() {
  const parts = UNIT.test.parts.map(p => '<li><b>' + esc(p.name) + '</b>: ' + p.slots.length + ' questions</li>').join('');
  return shell('<section class="card"><p class="kicker">Practice test</p><h1>A full test like last year\u2019s</h1>' +
    '<p>' + testCount() + ' questions, built the same way as the unit test. Every test is a new version: new numbers and a fresh mix of questions.</p>' +
    '<ul class="plain">' + parts + '</ul>' +
    '<ul class="plain"><li>No hints and no Show me how, like the real thing.</li><li>You can go back, change answers, and mark questions to look at again.</li><li>You get your score, a topic-by-topic breakdown, and a full review at the end.</li><li>The real test is about ' + UNIT.test.minutes + ' minutes. A clock runs so you can practice your pace, but nothing stops you.</li></ul>' +
    '<div class="btns"><button class="btn" data-act="start-test">Start the test</button><a class="btn ghost" href="#/">Not now</a></div></section>');
}
function startTest() {
  TEST = { items: buildTest(), idx: 0, started: Date.now(), done: false };
  go('#/test');
}
function testView() {
  if (!TEST || TEST.done) return testPlanView();
  const it = TEST.items[TEST.idx], q = it.q, n = TEST.items.length;
  const nav = TEST.items.map((x, i) => '<button class="navb' + (i === TEST.idx ? ' cur' : '') + (x.picked !== null ? ' ans' : '') + (x.flag ? ' flag' : '') + '" data-act="tgo" data-i="' + i + '" aria-label="Question ' + (i + 1) + (x.picked !== null ? ', answered' : ', not answered') + (x.flag ? ', marked for review' : '') + '">' + (i + 1) + '</button>').join('');
  const choices = q.choices.map((c, i) => '<li><button class="ch' + (i === it.picked ? ' sel' : '') + '" data-act="tchoose" data-i="' + i + '" aria-pressed="' + (i === it.picked) + '"><span class="ltr">' + LETTERS[i] + '</span><span class="ctext">' + c.html + '</span></button></li>').join('');
  const answered = TEST.items.filter(x => x.picked !== null).length;
  return shell('<section class="card q testcard"><div class="qhead"><span class="mode">Practice test</span><span class="chip">' + esc(UNIT.test.parts[it.part].name) + '</span>' +
    '<span class="prog">Question ' + (TEST.idx + 1) + ' of ' + n + ' \u00b7 ' + answered + ' answered \u00b7 <b id="clock">' + fmtTime(Date.now() - TEST.started) + '</b></span></div>' +
    '<div class="navgrid" role="group" aria-label="Question navigator">' + nav + '</div>' +
    '<div class="prompt">' + q.prompt + '</div><ol class="choices' + (q.choices.every(c => c.html.indexOf('<svg') === 0) ? ' diag' : '') + '">' + choices + '</ol>' +
    '<div class="btns"><button class="btn ghost" data-act="tback"' + (TEST.idx === 0 ? ' disabled' : '') + '>Back</button>' +
    '<button class="btn" data-act="tnext"' + (TEST.idx === n - 1 ? ' disabled' : '') + '>Next</button>' +
    '<button class="pill' + (it.flag ? ' on' : '') + '" data-act="tflag" aria-pressed="' + it.flag + '">' + (it.flag ? 'Marked for review' : 'Mark for review') + '</button>' +
    '<button class="btn quiet" data-act="tsubmit">Submit test</button></div>' +
    '<p class="small">Hints are off during the test. Your score and a full review come after you submit.</p></section>', { cls: 'wide' });
}
function submitTest() {
  const T = TEST; T.done = true; T.ended = Date.now();
  T.items.forEach(it => { it.ok = it.picked !== null && it.q.choices[it.picked].ok; if (it.picked !== null) { recordLocal(it.q.key, it.ok, null, null); reportClass(it.q.key, it.ok); } });
  const per = {}; T.items.forEach(it => { const p = per[it.q.topic] || (per[it.q.topic] = [0, 0]); p[1] += 1; if (it.ok) p[0] += 1; });
  T.per = per; T.score = T.items.filter(it => it.ok).length;
  S.tests = (S.tests || []).concat([{ s: T.score, n: T.items.length }]).slice(-5); saveState();
  go('#/testresult');
}
function reviewChoices(it) {
  return '<ol class="choices">' + it.q.choices.map((c, i) => {
    const cls = c.ok ? ' right' : (i === it.picked ? ' wrong' : ' off');
    return '<li><div class="ch' + cls + '"><span class="ltr">' + LETTERS[i] + '</span><span class="ctext">' + c.html + '</span></div>' +
      (c.ok ? '<div class="why good"><b>Why ' + LETTERS[i] + ' is right:</b> ' + esc(it.q.explain.replace(/<[^>]+>/g, '')) + '</div>' : '<div class="why"><b>Why not ' + LETTERS[i] + '?</b> ' + esc(c.why) + '</div>') + '</li>';
  }).join('') + '</ol>';
}
function testResultView() {
  const T = TEST; if (!T || !T.done) return testPlanView();
  const n = T.items.length, pct = Math.round(100 * T.score / n);
  const partScore = pi => { const xs = T.items.filter(x => x.part === pi); return xs.filter(x => x.ok).length + ' of ' + xs.length; };
  const topicRows = Object.keys(T.per).map(t => '<tr><td>' + esc(UNIT.topicById[t].name) + '</td><td>' + T.per[t][0] + ' of ' + T.per[t][1] + '</td><td>' + (T.per[t][0] === T.per[t][1] ? '<span class="status s-ready">All right</span>' : '<span class="status s-work">Review this</span>') + '</td></tr>').join('');
  const detail = (it, i) => '<details class="card wr"' + (it.ok ? '' : ' open') + '><summary><b>Question ' + (i + 1) + '</b> \u00b7 ' + (it.picked === null ? 'Left blank' : it.ok ? 'Correct' : 'Missed') + ' \u00b7 ' + esc(UNIT.topicById[it.q.topic].name) + '</summary><div class="prompt">' + it.q.prompt + '</div>' + reviewChoices(it) + '</details>';
  const missed = T.items.map((it, i) => [it, i]).filter(x => !x[0].ok), right = T.items.map((it, i) => [it, i]).filter(x => x[0].ok);
  const weak = Object.keys(T.per).filter(t => T.per[t][0] < T.per[t][1]);
  return shell('<section class="card"><p class="kicker">Practice test done</p><h1><span class="scorebig">' + T.score + ' of ' + n + '</span> right (' + pct + '%)</h1>' +
    '<p>Time: ' + fmtTime(T.ended - T.started) + ' (the real test is about ' + UNIT.test.minutes + ' minutes). ' + esc(UNIT.test.parts[0].name) + ': ' + partScore(0) + '. ' + esc(UNIT.test.parts[1].name) + ': ' + partScore(1) + '.</p>' +
    '<div class="scroll"><table><thead><tr><th>Topic</th><th>Right</th><th></th></tr></thead><tbody>' + topicRows + '</tbody></table></div>' +
    '<div class="btns">' + (weak.length ? '<button class="btn" data-act="practice-missed">Practice the topics I missed</button>' : '') + '<button class="btn ghost" data-act="start-test">Take a new practice test</button><a class="btn ghost" href="#/">Home</a></div></section>' +
    (missed.length ? '<h2>Questions to review (' + missed.length + ')</h2>' + missed.map(x => detail(x[0], x[1])).join('') : '<p class="banner ok">You got every question right!</p>') +
    (right.length ? '<h2>Questions you got right (' + right.length + ')</h2>' + right.map(x => detail(x[0], x[1])).join('') : ''));
}
function startClock() {
  clearInterval(window.__clock);
  window.__clock = setInterval(() => { const el = $('#clock'); if (!el || !TEST || TEST.done) { clearInterval(window.__clock); return; } el.textContent = fmtTime(Date.now() - TEST.started); }, 1000);
}

/* ---------- router ---------- */
async function render() {
  const h = location.hash || '#/';
  const app = $('#app');
  let html;
  if (h === '#/plan') html = planView();
  else if (h === '#/q') html = qView();
  else if (h === '#/result') html = resultView();
  else if (h === '#/notes') html = notesView();
  else if (h === '#/tips') html = tipsView();
  else if (h === '#/written') html = writtenView();
  else if (h === '#/testplan') html = testPlanView();
  else if (h === '#/test') html = testView();
  else if (h === '#/testresult') html = testResultView();
  else if (h === '#/code') html = codeView();
  else if (h === '#/insights') { loadClassLocal(); app.innerHTML = shell('<p class="lead">Loading class data\u2026</p>'); CLASS_MODE = await refreshClass(); html = insightsView(); }
  else html = homeView();
  app.innerHTML = html;
  const nv = app.querySelectorAll('nav a'); nv.forEach(a => { if (a.getAttribute('href') === h) a.setAttribute('aria-current', 'page'); });
  if (h === '#/test' && TEST && !TEST.done) startClock();
  if (!window.__noscroll) window.scrollTo(0, 0);
}

const ACT = {
  opt(el) {
    const id = el.dataset.id;
    if (id === 'quiz' || id === 'topics') { HOME.panel = HOME.panel === id ? null : id; render(); }
    else if (id === 'test') go('#/testplan');
    else { S.scope = id === 'unit' ? scopeUnit() : scopeChal(); saveState(); go('#/plan'); }
  },
  'pick-quiz'(el) { S.scope = scopeQuiz(el.dataset.id); saveState(); go('#/plan'); },
  'topic-toggle'(el) { HOME.sel[el.dataset.id] = el.checked; const b = $('[data-act="go-topics"]'); const n = Object.keys(HOME.sel).filter(k => HOME.sel[k]).length; if (b) { b.disabled = !n; b.textContent = 'Study ' + (n ? n + ' topic' + (n > 1 ? 's' : '') : 'these topics'); } },
  'go-topics'() { const ids = UNIT.topics.map(t => t.id).filter(t => HOME.sel[t]); if (ids.length) { S.scope = scopeTopics(ids); saveState(); go('#/plan'); } },
  pre() { startCheck('pre'); },
  'start-practice'() { startPractice(); },
  'plan-toggle'(el) { el.dataset.on = el.checked ? '1' : '0'; },
  'start-plan'() { const ids = Array.prototype.map.call(document.querySelectorAll('[data-act="plan-toggle"]:checked'), x => x.dataset.id); if (!ids.length) return; startPractice(ids); },
  choose(el) { if (SESSION.done) return; SESSION.picked = Number(el.dataset.i); render(); },
  conf(el) { SESSION.conf = el.dataset.v; render(); },
  check() { if (SESSION.picked !== null && !SESSION.done) answer(false); },
  skip() { if (!SESSION.done) answer(true); },
  next() { nextQuestion(); },
  hint() {
    const s = SESSION, q = s.q; if (s.hints >= 3 || s.done) return; s.hints += 1;
    const wrongIdx = q.choices.map((c, i) => c.ok ? -1 : i).filter(i => i >= 0 && s.elim.indexOf(i) < 0 && i !== s.picked);
    if (s.hints === 1) s.hintTexts.push('<b>Hint 1:</b> ' + UNIT.topicById[q.topic].idea);
    else if (s.hints === 2 && q.hint) s.hintTexts.push('<b>Hint 2:</b> ' + q.hint);
    else if (wrongIdx.length) { const i = pick(wrongIdx); s.elim.push(i); s.hintTexts.push('<b>Hint ' + s.hints + ':</b> Choice ' + LETTERS[i] + ' is not right. I crossed it out.'); }
    else s.hintTexts.push('<b>Hint ' + s.hints + ':</b> Try reading the question again and compare the choices that are left.');
    render();
  },
  how() { if (!SESSION.done) { SESSION.showed = true; render(); } },
  'finish-practice'() { if (SESSION.results.length < 1) return; startCheck('post'); },
  'copy-code'() {
    const t = $('#mycode'); const msg = $('#copymsg');
    const ok = () => { msg.textContent = 'Copied. Paste it somewhere safe, or into this page on another computer.'; };
    try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t.value).then(ok, () => { t.select(); document.execCommand('copy'); ok(); }); return; } } catch (e) {}
    t.select(); try { document.execCommand('copy'); ok(); } catch (e) { msg.textContent = 'Select the code and copy it yourself.'; }
  },
  'restore-code'() {
    const r = decodeProgress($('#incode').value), msg = $('#restoremsg');
    if (!r.ok) { msg.textContent = r.error; return; }
    if (Object.keys(S.keys).length && !window.confirm('This replaces the progress on this device with the code\u2019s progress. Continue?')) return;
    const scope = S.scope; S = r.state; S.scope = scope; saveState();
    const n = Object.keys(S.keys).length; msg.textContent = 'Restored! ' + n + ' question' + (n === 1 ? '' : 's') + ' of history came back.';
  },
  'start-test'() { startTest(); },
  tchoose(el) { TEST.items[TEST.idx].picked = Number(el.dataset.i); window.__noscroll = true; render(); window.__noscroll = false; },
  tgo(el) { TEST.idx = Number(el.dataset.i); render(); },
  tnext() { if (TEST.idx < TEST.items.length - 1) { TEST.idx += 1; render(); } },
  tback() { if (TEST.idx > 0) { TEST.idx -= 1; render(); } },
  tflag() { const it = TEST.items[TEST.idx]; it.flag = !it.flag; window.__noscroll = true; render(); window.__noscroll = false; },
  tsubmit() {
    const blank = TEST.items.filter(x => x.picked === null).length, fl = TEST.items.filter(x => x.flag).length;
    const msg = blank ? 'You left ' + blank + ' question' + (blank > 1 ? 's' : '') + ' unanswered' + (fl ? ' and marked ' + fl + ' for review' : '') + '. Submit anyway?' : (fl ? 'You marked ' + fl + ' question' + (fl > 1 ? 's' : '') + ' for review. Submit anyway?' : 'Submit your test?');
    if (window.confirm(msg)) submitTest();
  },
  'practice-missed'() { const weak = Object.keys(TEST.per).filter(t => TEST.per[t][0] < TEST.per[t][1] && t !== 'chal'); if (!weak.length) return; S.scope = scopeUnit(); saveState(); startPractice(weak); },
  reset() { if (window.confirm('Clear all practice history on this device?')) { S = newState(); saveState(); go('#/'); } }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'INPUT') return; if (el.disabled) return; ACT[el.dataset.act] && ACT[el.dataset.act](el, e); });
document.addEventListener('change', e => { const el = e.target; if (el.tagName === 'INPUT' && el.dataset.act && ACT[el.dataset.act]) ACT[el.dataset.act](el, e); });
window.addEventListener('hashchange', render);
if (typeof document !== 'undefined') {
  document.addEventListener('DOMContentLoaded', () => { loadState(); loadClassLocal(); render(); });
}

</script>
</body>
</html>
