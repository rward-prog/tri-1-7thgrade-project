<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grade Yourself | Exercise Science Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6FA; --card:#FFFFFF; --ink:#13203B; --muted:#58637D; --line:#D6DEEB;
  --pulse:#E5384A; --pulse-soft:#FDE7EA; --blue:#2358D8; --blue-soft:#E4ECFD;
  --done:#1F8F6E; --done-soft:#DDF3EA; --sun:#FFC83D; --sun-soft:#FFF4D1;
  --amber:#B7791F; --amber-soft:#FEF0D0;
  --head:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.5;font-size:16px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--head);line-height:1.1;letter-spacing:-.01em}
.page{max-width:1100px;margin:0 auto;padding:20px}
.top{background:var(--ink);color:#fff;border-radius:16px;padding:24px 28px;margin-bottom:16px}
.top h1{font-size:clamp(28px,4.5vw,42px);font-weight:800}
.top p{opacity:.85;margin-top:6px;max-width:60ch}
.top a{color:var(--sun)}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.info{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px}
@media(max-width:640px){.info{grid-template-columns:1fr}}
.field label{display:block;font-weight:700;font-size:14px;margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;font:inherit;font-size:16px;padding:9px 11px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.field textarea{min-height:64px;resize:vertical}
.btn{display:inline-block;font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;text-decoration:none;background:var(--blue);color:#fff}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--blue-soft);color:var(--blue)}
.btn.red{background:var(--pulse)}
.btn.gray{background:#6B7690}
.btn.green{background:var(--done)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}

/* timer */
.timer{position:sticky;top:0;z-index:30;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 18px;margin-bottom:16px;display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;box-shadow:0 4px 12px rgba(19,32,59,.08)}
.timer .digits{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:46px;font-weight:700;min-width:150px;text-align:center}
.timer .digits.go{color:var(--done)} .timer .digits.over{color:var(--pulse)}
.timer .hint{font-size:14px;font-weight:600;color:var(--muted)}

/* scorer */
.sec-hdr{background:var(--ink);color:#fff;padding:11px 16px;margin:22px 0 10px;border-radius:10px;font-family:var(--head);font-weight:800;font-size:19px;display:flex;justify-content:space-between;gap:10px}
.sec-hdr small{font-family:var(--body);font-weight:600;opacity:.8;font-size:14px}
.crit{background:#fff;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.crit.flagged{border-left-color:var(--pulse)}
.crit-title{display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:800;margin-bottom:8px}
.crit-title .pts{font-weight:600;color:var(--muted);font-size:14px}
.score-row{display:flex;gap:8px;flex-wrap:wrap}
.sbtn{flex:1;min-width:130px;padding:9px 11px;border:2px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;font:inherit;text-align:left;line-height:1.35;color:var(--ink)}
.sbtn:hover{border-color:#9AA6BF;background:#F7F9FC}
.sbtn .n{display:block;font-family:var(--head);font-size:22px;font-weight:800;color:var(--muted)}
.sbtn .l{display:block;font-size:13px;font-weight:700;color:var(--muted)}
.sbtn .d{display:block;font-size:13.5px;color:#38476A;margin-top:2px}
.sbtn.sel.hi{border-color:var(--done);background:var(--done-soft)}
.sbtn.sel.mid{border-color:var(--blue);background:var(--blue-soft)}
.sbtn.sel.low{border-color:var(--amber);background:var(--amber-soft)}
.sbtn.sel.zero{border-color:var(--pulse);background:var(--pulse-soft)}
.sbtn.sel .n,.sbtn.sel .l{color:var(--ink)}
.crit .extra{margin-top:10px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.crit .extra textarea{flex:1;min-width:220px;font:inherit;font-size:15px;padding:8px 10px;border:2px solid var(--line);border-radius:8px;min-height:52px;resize:vertical}
.flag{display:flex;gap:6px;align-items:center;font-weight:700;font-size:14px;color:#B3202F;cursor:pointer}
.flag input{width:18px;height:18px;accent-color:var(--pulse)}
.seccmt{width:100%;font:inherit;font-size:15px;padding:9px 11px;border:2px solid var(--line);border-radius:8px;min-height:56px;resize:vertical;margin-bottom:6px}

.total{position:sticky;bottom:0;z-index:20;background:var(--ink);color:#fff;border-radius:14px;padding:14px 22px;margin:18px 0;text-align:center;font-family:var(--head);font-weight:800;font-size:26px}
.total .chip{display:inline-block;margin-left:12px;padding:0 14px;border-radius:8px;font-size:28px;background:var(--sun);color:var(--ink)}
.total small{font-family:var(--body);font-weight:600;font-size:15px;opacity:.8;margin-left:10px}

/* tables */
table.t{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
table.t th{background:var(--ink);color:#fff;padding:8px 6px;text-align:center;font-size:13px}
table.t td{padding:6px;border-bottom:1px solid var(--line);text-align:center}
table.t td:first-child,table.t th:first-child{text-align:left}
table.t input{width:100%;min-width:56px;font:inherit;font-size:15px;padding:6px;border:2px solid var(--line);border-radius:6px;text-align:center}
table.t input.nm{text-align:left;min-width:110px}
.scrollx{overflow-x:auto}
.note{font-size:14px;color:var(--muted);margin-top:6px}
.weak li{margin-left:20px;margin-bottom:4px}

@media print{
  body{background:#fff;font-size:12px}
  .page{padding:0}
  .no-print,.timer .btnrow,.btnrow,.flag input{display:none !important}
  .timer{position:static;box-shadow:none}
  .sbtn:not(.sel){display:none}
  .sbtn{border-width:2px}
  .total{position:static;color:#000;background:#fff;border:2px solid #000}
  .top{background:#fff;color:#000;border:2px solid #000}
  .sec-hdr{background:#fff;color:#000;border:2px solid #000}
  .crit{break-inside:avoid}
}

</style>
</head>
<body>
<div class="page">
  <div class="top">
    <h1>Grade yourself first</h1>
    <p>Use the same rubric your teacher will use. Be honest and point to real evidence in your work. You will see exactly what would raise your score. <a href="index.html">Back to the project page</a></p>
  </div>

  <div class="panel no-print">
    <div class="btnrow" role="tablist" aria-label="Choose a rubric">
      <button class="btn" id="tabMM" type="button">Materials and Methods (36 pts)</button>
      <button class="btn ghost" id="tabFinal" type="button">Final presentation (72 pts)</button>
    </div>
  </div>

  <div class="panel">
    <div class="info">
      <div class="field"><label for="sName">Your name</label><input id="sName" autocomplete="off"></div>
      <div class="field"><label for="sPartner">Partner</label><input id="sPartner" autocomplete="off"></div>
      <div class="field"><label for="sDate">Date</label><input id="sDate" readonly></div>
    </div>
  </div>

  <h2 id="rubTitle" style="margin:6px 0"></h2>
  <div id="mmRoot"></div>
  <div id="finalRoot" hidden></div>

  <div class="total" aria-live="polite"><span id="totNum">0</span> / <span id="totMax">0</span><span class="chip" id="chip">-</span><small id="pctTxt"></small></div>

  <div class="panel">
    <h3 style="margin-bottom:8px">What would raise my score the most</h3>
    <ul class="weak" id="weakList"><li>Score at least one criterion to see suggestions.</li></ul>
  </div>

  <div class="panel">
    <div class="field"><label for="plan">My plan: what will I fix or practice before I present?</label><textarea id="plan"></textarea></div>
    <div class="btnrow no-print" style="margin-top:12px">
      <button class="btn" id="printBtn" type="button">Print or save as PDF</button>
      <button class="btn ghost" id="copyBtn" type="button">Copy my summary</button>
      <button class="btn gray" id="resetBtn" type="button">Start over</button>
      <span class="note" id="msg" role="status"></span>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   RUBRIC DATA: the single source of truth.
   Edit wording or point values here and the student site, the student
   self-check page, and the teacher grader all update together.
   max = points for the criterion. levels = what each score looks like.
   ===================================================================== */
window.RUBRICS = {

/* ---------- Materials and Methods (check-in) presentation, 36 pts ---------- */
mm: {
  key: "mm",
  title: "Materials and Methods Presentation",
  timeMax: 5,
  sections: [
    { name: "Scientific thinking", items: [
      { id:"1A", name:"Research question", max:3, levels:{
        3:"Clear, testable question at or above 7th-grade level; strong scientific thinking.",
        2:"Testable but may be too simple or slightly below grade level.",
        1:"Unclear, untestable, or well below grade level.",
        0:"No research question presented." }},
      { id:"1B", name:"Hypothesis", max:3, levels:{
        3:"In proper If, then, because format and logically connects to the research question.",
        2:"Present and mostly correct, but format or the connection to the question is weak.",
        1:"Missing, not in If, then format, or does not relate to the experiment.",
        0:"No hypothesis presented." }},
      { id:"1C", name:"Null hypothesis", max:3, levels:{
        3:"Correctly states that there will be no difference between the conditions, and matches the dependent variable.",
        2:"Present, but unclear or not clearly a \"no difference\" statement.",
        1:"Missing a key part, or confused with the hypothesis.",
        0:"No null hypothesis presented." }},
      { id:"1D", name:"Variables (IV, DV, controls)", max:3, levels:{
        3:"Correctly identifies IV, DV, and at least 3 important controls with clear explanations.",
        2:"Identifies IV, DV, and some controls, but explanations are incomplete or partly incorrect.",
        1:"Variables missing or wrong, or fewer than 3 controls listed.",
        0:"No variables identified." }}
    ]},
    { name: "Procedure, materials, and data table", items: [
      { id:"2A", name:"Method / procedure", max:3, levels:{
        3:"Detailed, step-by-step procedure another group could replicate; the bulk of the presentation.",
        2:"Present but lacks some detail or steps needed to replicate.",
        1:"Vague, incomplete, or only briefly mentioned.",
        0:"No procedure presented." }},
      { id:"2B", name:"Materials list", max:3, levels:{
        3:"Complete bullet list of all materials needed; specific and accurate.",
        2:"Materials listed but some items are missing or not specific.",
        1:"Missing, incomplete, or not a bullet list.",
        0:"No materials list presented." }},
      { id:"2C", name:"Timeline and planning", max:3, levels:{
        3:"Realistic hour estimate with clear justification and a specific plan for when and how work will be completed.",
        2:"Time estimate given but justification or plan is vague.",
        1:"No estimate, or the plan is unrealistic or missing.",
        0:"No timeline or planning presented." }},
      { id:"2D", name:"Data table layout", max:3, levels:{
        3:"Labeled columns with Capitalized headers and units, a row for every trial and condition, and empty cells ready for data.",
        2:"Table is present but missing units, headers, or a clear layout.",
        1:"Table is unclear or missing labels.",
        0:"No data table shown." }}
    ]},
    { name: "Slide design", items: [
      { id:"3A", name:"Slide design", max:3, levels:{
        3:"Photos from your own experiment on every slide; minimal text; slide titles capitalized; clean and engaging.",
        2:"Most slides have photos of the experiment; some are text-heavy, off-topic, or have lowercase titles.",
        1:"Few experiment photos, GIFs or unrelated images, or cluttered with too much text.",
        0:"No slides shown." }}
    ]},
    { name: "Public speaking", items: [
      { id:"4A", name:"Speaking skills", max:3, levels:{
        3:"Clear and confident, consistent eye contact, does not read from the slides.",
        2:"Generally clear but relies on notes or slides; some hesitation.",
        1:"Hard to hear or understand; reads directly from slides.",
        0:"Did not speak or was absent." }},
      { id:"4B", name:"Organization and flow", max:3, levels:{
        3:"Logical order with smooth transitions that connect each slide to the next; easy to follow.",
        2:"Mostly logical but some parts feel out of place or abrupt.",
        1:"Disorganized or difficult to follow.",
        0:"No discernible structure." }},
      { id:"4C", name:"Equal participation", max:3, levels:{
        3:"All partners speak a roughly equal amount of time.",
        2:"Most partners speak, but time is noticeably uneven.",
        1:"One partner dominates; the other barely speaks.",
        0:"Only one partner spoke, or the group was absent." }},
      { id:"4D", name:"Time (5 min max)", max:3, levels:{
        3:"4 to 5 minutes, well paced with nothing rushed or dragged out.",
        2:"Slightly under or over (3 to 4 or 5 to 6 minutes); pacing is uneven.",
        1:"Under 3 minutes or over 6 minutes; rushed or padded.",
        0:"No presentation given." }}
    ]}
  ]
},

/* ---------- Final presentation, 72 pts ---------- */
final: {
  key: "final",
  title: "Final Presentation",
  timeMax: 8,
  sections: [
    { name: "Introduction", items: [
      { id:"1A", name:"Background and sources", max:4, levels:{
        4:"Clear background a classmate can follow; two credible Google Scholar sources, each with a summary and a 'What this means' for the experiment.",
        3:"Adequate background; two sources with summaries, but 'What this means' is thin or missing for one.",
        2:"Background is vague or incomplete, or only one source.",
        1:"Background and/or sources missing." }},
      { id:"1B", name:"Research question", max:4, levels:{
        4:"Clear, specific, and testable.",
        3:"Clear but slightly broad.",
        2:"Present but unclear.",
        1:"Missing or not a real question." }},
      { id:"1C", name:"Hypothesis with reasoning", max:4, levels:{
        4:"If, then, because prediction with strong reasoning supported by a source.",
        3:"Reasonable prediction; the reasoning or source is thin.",
        2:"Prediction is weak or poorly explained.",
        1:"Missing or unrelated to the experiment." }},
      { id:"1D", name:"Null hypothesis", max:4, levels:{
        4:"Correct null hypothesis: states there will be no difference between the conditions, and matches the dependent variable.",
        3:"Null hypothesis is present with a small wording problem.",
        2:"Unclear or not a \"no difference\" statement.",
        1:"Missing, or confused with the hypothesis." }}
    ]},
    { name: "Recap, data, and graphs", items: [
      { id:"2A", name:"Recap of the experiment", max:4, levels:{
        4:"One clear recap slide (question, IV, DV, conditions, number of trials, hypothesis) placed right before the results so the audience can follow the data.",
        3:"Recap slide is present with one small piece missing.",
        2:"Recap is incomplete or hard to follow.",
        1:"No recap slide." }},
      { id:"2B", name:"Data table and graph together", max:4, levels:{
        4:"Complete table (all 10 data points) with Capitalized headers, units, alternating colors, and outlined cells, shown with a graph of the correct type that matches it, on the same slide.",
        3:"Table and graph are both present with minor issues (a missing format step or one unit), or they are on separate slides.",
        2:"Table or graph is partly complete, messy, confusing, or the wrong type of graph.",
        1:"Missing or unusable." }},
      { id:"2C", name:"Graph labels, units, and capitals", max:4, levels:{
        4:"Graph title and both axis titles use Capitalized Important Words and include units; easy to read.",
        3:"Mostly clear; one small capitalization or unit error.",
        2:"Several labels, units, or capital letters missing.",
        1:"Poor or missing labels." }}
    ]},
    { name: "Data analysis", items: [
      { id:"3A", name:"Compare the conditions", max:4, levels:{
        4:"Uses numbers to clearly compare the conditions, including percent change from each trial's starting number when there is one.",
        3:"Compares the conditions with some numbers.",
        2:"Limited or vague comparison.",
        1:"Little or no comparison." }},
      { id:"3B", name:"P-value analysis", max:4, levels:{
        4:"States the p-value and explains in their own words whether the difference is statistically significant, and whether the null hypothesis is rejected.",
        3:"States the p-value with a mostly correct explanation, but does not connect it to the null hypothesis.",
        2:"Mentions the p-value but the explanation is vague or partly incorrect.",
        1:"No p-value or no explanation." }},
      { id:"3C", name:"Explain why it happened", max:4, levels:{
        4:"Thoughtful scientific explanation using science vocabulary.",
        3:"Reasonable explanation.",
        2:"Vague or partly incorrect.",
        1:"Little or no explanation." }}
    ]},
    { name: "Conclusion, errors, and future", items: [
      { id:"4A", name:"Conclusion about the hypothesis", max:4, levels:{
        4:"Clearly states whether the hypothesis was supported, backed by evidence and the p-value.",
        3:"States whether it was supported with brief evidence.",
        2:"Vague or weak.",
        1:"Missing or incorrect." }},
      { id:"4B", name:"Possible errors", max:4, levels:{
        4:"Several specific, realistic errors in the design, equipment, measuring, or uncontrolled variables. 'Human error' does not count.",
        3:"At least one specific, realistic error that is not 'human error'.",
        2:"Vague, unrealistic, or mostly 'human error'.",
        1:"Little or none, or only 'human error' or 'we messed up'." }},
      { id:"4C", name:"How they would fix the errors", max:4, levels:{
        4:"Specific, practical changes to the experiment tied to each error.",
        3:"At least one reasonable fix.",
        2:"Vague ('be more careful').",
        1:"No meaningful fixes." }},
      { id:"4D", name:"Future expansion", max:4, levels:{
        4:"Creative and realistic bigger version of the study with a clear purpose.",
        3:"Reasonable expansion idea.",
        2:"Vague or unrealistic.",
        1:"Missing." }}
    ]},
    { name: "References", items: [
      { id:"5A", name:"APA references", max:4, levels:{
        4:"Two credible sources; citations on the slides and on the References slide are correct and consistent.",
        3:"Two sources with minor APA errors or small inconsistencies.",
        2:"Fewer than two sources.",
        1:"No References slide or sources." }}
    ]},
    { name: "Public speaking and slide design", items: [
      { id:"6A", name:"Clarity and volume", max:2, levels:{ 2:"Clear and easy to hear.", 1:"Generally clear, but often hard to hear.", 0:"Unable to hear." }},
      { id:"6B", name:"Eye contact", max:2, levels:{ 2:"Regular eye contact.", 1:"Some eye contact.", 0:"Little or none." }},
      { id:"6C", name:"Use of slides and notes", max:2, levels:{ 2:"Minimal reading.", 1:"Some reading.", 0:"Mostly reads." }},
      { id:"6D", name:"Handling questions", max:2, levels:{ 2:"Confident and accurate.", 1:"Partial or needed prompting.", 0:"Struggles." }},
      { id:"6E", name:"Slide readability and titles", max:2, levels:{ 2:"Large enough to read from the back; every slide title is capitalized.", 1:"Mostly readable, or a few titles are not capitalized.", 0:"Often too small, or titles are not capitalized." }},
      { id:"6F", name:"Images from the experiment", max:4, levels:{
        4:"Every image comes from your experiment (your own photos, graphs, or labeled diagrams). No GIFs or random pictures. Any AI-made image is labeled.",
        3:"Nearly all images are from the experiment; one is generic or an AI image is not labeled.",
        2:"Several images are generic, from a search for your hypothesis, or unrelated.",
        1:"Mostly GIFs, memes, or unrelated images." }},
      { id:"6G", name:"Equal participation", max:2, levels:{ 2:"Both partners speak about equally.", 1:"Time is noticeably uneven.", 0:"One partner dominates or does not speak." }},
      { id:"6I", name:"Flow and storytelling", max:4, levels:{
        4:"Tells a story: a reason to care, each slide leads into the next with a connecting sentence, and it ends with what it means. Not just the checklist in order.",
        3:"Mostly connected; a few slides feel like separate pieces.",
        2:"Follows the rubric order with little connection between slides.",
        1:"Disorganized or hard to follow." }},
      { id:"6H", name:"Time (8 min max)", max:2, levels:{ 2:"5 to 8 minutes and well paced.", 1:"3 to 5 minutes, or 8 to 9 minutes.", 0:"Under 3 minutes or over 9 minutes." }}
    ]}
  ]
}
};

/* helpers */
window.rubricTotal = function(r){ let t=0; r.sections.forEach(s=>s.items.forEach(i=>t+=i.max)); return t; };

/* which criterion is the time score, and how minutes map to a suggested score */
RUBRICS.mm.timeId = "4D";
RUBRICS.mm.timeScore = function(m){ return (m>=4&&m<=5)?3 : ((m>=3&&m<4)||(m>5&&m<=6))?2 : m>=0.5?1 : 0; };
RUBRICS.final.timeId = "6H";
RUBRICS.final.timeScore = function(m){ return (m>=5&&m<=8)?2 : ((m>=3&&m<5)||(m>8&&m<=9))?1 : 0; };

</script>
<script>
/* Shared rubric scoring widget.
   buildScorer(rootElement, rubric, { notes, flags, sectionComments, onChange }) */
(function(){
  var LABELS = {
    4:{4:"Excellent",3:"Good",2:"Developing",1:"Beginning",0:"Not present"},
    3:{3:"Excellent",2:"Developing",1:"Needs work",0:"Not present"},
    2:{2:"Full",1:"Partial",0:"None"}
  };
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function band(v,max){ var f=v/max; return f>=0.99?"hi":f>=0.6?"mid":f>0?"low":"zero"; }

  window.buildScorer = function(root, rubric, opts){
    opts = opts || {};
    var scores = {}, items = [];
    root.innerHTML = "";

    rubric.sections.forEach(function(sec,si){
      var secMax = sec.items.reduce(function(a,i){return a+i.max;},0);
      var h = document.createElement("div"); h.className="sec-hdr";
      h.innerHTML = "<span>"+esc(sec.name)+"</span><small>"+secMax+" pts</small>";
      root.appendChild(h);

      sec.items.forEach(function(it){
        items.push(it); scores[it.id] = null;
        var c = document.createElement("div"); c.className="crit"; c.dataset.id = it.id;
        var lv = [];
        for (var v=it.max; v>=0; v--) lv.push(v);
        var btns = lv.map(function(v){
          var desc = it.levels[v] != null ? it.levels[v] : "Missing or not presented.";
          return '<button type="button" class="sbtn" data-v="'+v+'"><span class="n">'+v+'</span><span class="l">'+(LABELS[it.max][v]||"")+'</span><span class="d">'+esc(desc)+'</span></button>';
        }).join("");
        var extra = "";
        if (opts.notes) extra += '<textarea data-note="'+it.id+'" placeholder="Why did I pick this score? Where in my work can I point to it?" aria-label="Evidence for '+esc(it.name)+'"></textarea>';
        if (opts.flags) extra += '<label class="flag"><input type="checkbox" data-flag="'+it.id+'"> Ask a question</label>';
        c.innerHTML = '<div class="crit-title"><span>'+it.id+'. '+esc(it.name)+'</span><span class="pts">'+it.max+' pts</span></div>'
          + '<div class="score-row">'+btns+'</div>' + (extra?'<div class="extra">'+extra+'</div>':"");
        root.appendChild(c);
      });

      if (opts.sectionComments){
        var t = document.createElement("textarea"); t.className="seccmt"; t.dataset.sec = String(si);
        t.placeholder = "Comments for "+sec.name+" (optional)";
        t.setAttribute("aria-label","Comments for "+sec.name);
        root.appendChild(t);
      }
    });

    function paint(){
      root.querySelectorAll(".crit").forEach(function(c){
        var it = items.filter(function(i){return i.id===c.dataset.id;})[0], v = scores[it.id];
        c.querySelectorAll(".sbtn").forEach(function(b){
          var on = v!==null && parseInt(b.dataset.v,10)===v;
          b.className = "sbtn" + (on ? " sel "+band(v,it.max) : "");
          b.setAttribute("aria-pressed", on);
        });
      });
    }
    function changed(){ paint(); if (opts.onChange) opts.onChange(api); }

    root.addEventListener("click", function(e){
      var b = e.target.closest(".sbtn"); if(!b) return;
      var id = b.closest(".crit").dataset.id, v = parseInt(b.dataset.v,10);
      scores[id] = (scores[id]===v) ? null : v;   // click again to clear
      changed();
    });
    root.addEventListener("change", function(e){
      var f = e.target.dataset && e.target.dataset.flag;
      if (f){ e.target.closest(".crit").classList.toggle("flagged", e.target.checked); changed(); }
    });

    var api = {
      items: items,
      getScores: function(){ return Object.assign({}, scores); },
      setScore: function(id,v){ scores[id]=v; changed(); },
      total: function(){ var t=0; for (var k in scores) if (scores[k]!==null) t+=scores[k]; return t; },
      max: function(){ return items.reduce(function(a,i){return a+i.max;},0); },
      scoredCount: function(){ var n=0; for (var k in scores) if (scores[k]!==null) n++; return n; },
      getNotes: function(){ var o={}; root.querySelectorAll("[data-note]").forEach(function(t){ o[t.dataset.note]=t.value.trim(); }); return o; },
      getFlags: function(){ var o=[]; root.querySelectorAll("[data-flag]:checked").forEach(function(c){ o.push(c.dataset.flag); }); return o; },
      getSectionComments: function(){ var o=[]; root.querySelectorAll(".seccmt").forEach(function(t){ o[parseInt(t.dataset.sec,10)] = t.value.trim(); }); return o; },
      reset: function(){
        for (var k in scores) scores[k]=null;
        root.querySelectorAll("textarea").forEach(function(t){ t.value=""; });
        root.querySelectorAll("[data-flag]").forEach(function(c){ c.checked=false; c.closest(".crit").classList.remove("flagged"); });
        changed();
      }
    };
    paint();
    return api;
  };

  window.letterGrade = function(pct){ return pct>=90?"A":pct>=80?"B":pct>=70?"C":pct>=60?"D":"F"; };
})();

</script>
<script>
(function(){
  var $ = function(s){return document.querySelector(s);};
  $("#sDate").value = new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});
  var which = (new URLSearchParams(location.search).get("r")==="final") ? "final" : "mm";
  var rub = RUBRICS, scorers = {};

  function update(){
    var r = rub[which], s = scorers[which];
    var t = s.total(), m = s.max(), pct = m ? Math.round(t/m*100) : 0;
    $("#totNum").textContent = t; $("#totMax").textContent = m;
    $("#chip").textContent = s.scoredCount() ? letterGrade(pct) : "-";
    $("#pctTxt").textContent = s.scoredCount() ? pct+"% ("+s.scoredCount()+" of "+s.items.length+" scored)" : "";
    var gaps = s.items.map(function(it){
      var v = s.getScores()[it.id]; return {it:it, v:v, gap: v===null ? 0 : it.max - v};
    }).filter(function(x){return x.gap>0;}).sort(function(a,b){return b.gap-a.gap;}).slice(0,4);
    var ul = $("#weakList");
    if (!s.scoredCount()) { ul.innerHTML = "<li>Score at least one criterion to see suggestions.</li>"; return; }
    if (!gaps.length) { ul.innerHTML = "<li>Every scored criterion is at full marks. Check that you scored them all.</li>"; return; }
    ul.innerHTML = gaps.map(function(x){
      var nextV = x.v+1, d = x.it.levels[nextV];
      return "<li><b>"+x.it.id+". "+x.it.name+"</b> ("+x.v+" of "+x.it.max+"). To get "+nextV+": "+(d||"")+"</li>";
    }).join("");
  }
  scorers.mm    = buildScorer($("#mmRoot"),    rub.mm,    {notes:true, onChange:update});
  scorers.final = buildScorer($("#finalRoot"), rub.final, {notes:true, onChange:update});

  function show(k){
    which = k;
    $("#mmRoot").hidden = k!=="mm"; $("#finalRoot").hidden = k!=="final";
    $("#tabMM").className = "btn"+(k==="mm"?"":" ghost"); $("#tabFinal").className = "btn"+(k==="final"?"":" ghost");
    $("#rubTitle").textContent = rub[k].title+" self-check";
    update();
  }
  $("#tabMM").onclick = function(){ show("mm"); };
  $("#tabFinal").onclick = function(){ show("final"); };
  $("#tabMM").textContent="Materials and Methods ("+rubricTotal(rub.mm)+" pts)";
  $("#tabFinal").textContent="Final presentation ("+rubricTotal(rub.final)+" pts)";
  show(which);

  $("#printBtn").onclick = function(){ window.print(); };
  $("#resetBtn").onclick = function(){ if(confirm("Clear all scores and notes for this rubric?")){ scorers[which].reset(); $("#plan").value=""; } };
  $("#copyBtn").onclick = function(){
    var s = scorers[which], sc = s.getScores(), notes = s.getNotes();
    var lines = [rub[which].title+" self-check", "Name: "+$("#sName").value+"  Partner: "+$("#sPartner").value, "Total: "+s.total()+" / "+s.max(), ""];
    s.items.forEach(function(it){ lines.push(it.id+". "+it.name+": "+(sc[it.id]===null?"not scored":sc[it.id]+"/"+it.max)+(notes[it.id]?" - "+notes[it.id]:"")); });
    lines.push("", "My plan: "+$("#plan").value);
    var text = lines.join("\n");
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(
      function(){ $("#msg").textContent = "Copied."; },
      function(){ $("#msg").textContent = "Copy did not work. Use Print instead."; });
  };
})();
</script>
</body>
